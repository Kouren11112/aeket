name: Windows Cloud RDP

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
      - name: 1. Enable Remote Desktop & Firewall
        run: |
          # 开启远程桌面
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -name "fDenyTSConnections" -Value 0

          # 关闭 NLA（网络级别身份验证）
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -name "UserAuthentication" -Value 0 -Type DWord

          # 安全层走最兼容模式（不走 TLS）
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -name "SecurityLayer" -Value 0 -Type DWord

          # 放宽 CredSSP 加密Oracle，兼容旧客户端
          New-Item -Path 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System\CredSSP\Parameters' -Force | Out-Null
          Set-ItemProperty -Path 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System\CredSSP\Parameters' -Name "AllowEncryptionOracle" -Value 2 -Type DWord

          # 强制防火墙放行远程桌面（所有网络配置文件）
          Set-NetFirewallRule -DisplayGroup "Remote Desktop" -Enabled True -Profile Any

          # 关键：重启远程桌面服务，让注册表修改生效
          Stop-Service TermService -Force -ErrorAction SilentlyContinue
          Start-Sleep -Seconds 3
          Start-Service TermService
          Start-Sleep -Seconds 3

          # 诊断：确认注册表值已生效
          Write-Host "===== 注册表验证 ====="
          Write-Host "fDenyTSConnections:"
          Get-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name "fDenyTSConnections"
          Write-Host "UserAuthentication:"
          Get-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "UserAuthentication"
          Write-Host "SecurityLayer:"
          Get-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name "SecurityLayer"
          Write-Host "AllowEncryptionOracle:"
          Get-ItemProperty -Path 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System\CredSSP\Parameters' -Name "AllowEncryptionOracle"

          Write-Host "===== qwinsta ====="
          qwinsta
          Write-Host "===== 3389 监听状态 ====="
          netstat -ano | findstr :3389

      - name: 2. Create Admin Account
        run: |
          $Password = ConvertTo-SecureString "P@ssw0rd1qazXSW@#" -AsPlainText -Force
          New-LocalUser -Name "NvdAdmin" -Password $Password -PasswordNeverExpires -ErrorAction SilentlyContinue
          Add-LocalGroupMember -Group "Administrators" -Member "NvdAdmin" -ErrorAction SilentlyContinue
          Add-LocalGroupMember -Group "Remote Desktop Users" -Member "NvdAdmin" -ErrorAction SilentlyContinue
          net user runneradmin P@ssw0rd1qazXSW@#

      - name: 3. Grant RDP Logon Rights to NvdAdmin
        run: |
          # 获取 NvdAdmin 的 SID
          $sid = (Get-LocalUser -Name "NvdAdmin").SID.Value
          Write-Host "NvdAdmin SID: $sid"

          # 导出当前安全策略
          secedit /export /cfg C:\secpol.cfg

          # 读取配置
          $cfg = Get-Content C:\secpol.cfg

          # 构造新的授权行
          $newRight = "SeRemoteInteractiveLogonRight = *S-1-5-32-544,*S-1-5-32-555,$sid"

          # 逐行替换
          $cfg = $cfg | ForEach-Object {
              if ($_ -match "^SeRemoteInteractiveLogonRight") {
                  $newRight
              } else {
                  $_
              }
          }

          # 拒绝列表只保留 Guests
          $cfg = $cfg | ForEach-Object {
              if ($_ -match "^SeDenyRemoteInteractiveLogonRight") {
                  "SeDenyRemoteInteractiveLogonRight = *S-1-5-32-546"
              } else {
                  $_
              }
          }

          # 关键：用 Unicode 写回，secedit 才认
          $cfg | Out-File -FilePath C:\secpol.cfg -Encoding Unicode

          # 应用策略
          secedit /configure /db C:\windows\security\local.sdb /cfg C:\secpol.cfg /areas SECURITYPOLICY

          # 诊断：确认策略已写入
          Write-Host "===== 当前 RDP 登录权限 ====="
          secedit /export /cfg C:\secpol_check.cfg
          Get-Content C:\secpol_check.cfg | Select-String "SeRemoteInteractiveLogonRight"
          Get-Content C:\secpol_check.cfg | Select-String "SeDenyRemoteInteractiveLogonRight"

          # 额外诊断：确认 NvdAdmin 的组归属
          Write-Host "===== NvdAdmin 组归属 ====="
          net user NvdAdmin

      - name: 4. Install & Connect Tailscale VPN
        env:
          TAILSCALE_AUTHKEY: ${{ secrets.TAILSCALE_AUTHKEY }}
        run: |
          # 下载并静默安装 Tailscale
          Invoke-WebRequest "https://pkgs.tailscale.com/stable/tailscale-setup-latest-amd64.msi" -OutFile "C:\tailscale.msi"
          Start-Process msiexec -ArgumentList "/i C:\tailscale.msi /quiet /norestart" -Wait

          # 连接 Tailscale
          Start-Sleep -Seconds 5
          & "C:\Program Files\Tailscale\tailscale.exe" up --authkey="$Env:TAILSCALE_AUTHKEY" --hostname="github-rdp-server"

          Start-Sleep -Seconds 8

          # 获取 Tailscale IP
          $ts_ip = & "C:\Program Files\Tailscale\tailscale.exe" ip -4

          # 再次确认 RDP 监听
          Write-Host "===== RDP 监听确认 ====="
          netstat -ano | findstr :3389

          Write-Host ""
          Write-Host "==========================================" -ForegroundColor Green
          Write-Host "  >>> RDP SERVER IS READY! <<<" -ForegroundColor Cyan
          Write-Host "  Tailscale IP : $ts_ip" -ForegroundColor Yellow
          Write-Host "  Username     : NvdAdmin" -ForegroundColor Yellow
          Write-Host "  Password     : P@ssw0rd1qazXSW@#" -ForegroundColor Yellow
          Write-Host "  >> Open mstsc and connect to: $ts_ip" -ForegroundColor Magenta
          Write-Host "==========================================" -ForegroundColor Green

      - name: 5. Keep Server Alive (48 Hours)
        run: |
          for ($i = 1; $i -le 2880; $i++) {
              Start-Sleep -Seconds 60
              Write-Host "[$i/2880] Server running..."
          }
